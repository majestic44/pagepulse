name: pagepulse

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}

x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-development}
  APP_VERSION: ${PUBLIC_APP_VERSION:-0.0.0-dev}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
  AUTH_ARGON2_MEMORY_KIB: ${AUTH_ARGON2_MEMORY_KIB:-65536}
  AUTH_ARGON2_PARALLELISM: ${AUTH_ARGON2_PARALLELISM:-1}
  AUTH_ARGON2_PASSES: ${AUTH_ARGON2_PASSES:-3}
  EMAIL_VERIFICATION_TOKEN_TTL_MINUTES: ${EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:-1440}
  PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-60}
  AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-5}
  AUTH_LOGIN_RATE_LIMIT_WINDOW_MS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
  AUTH_RESET_RATE_LIMIT_MAX: ${AUTH_RESET_RATE_LIMIT_MAX:-3}
  AUTH_RESET_RATE_LIMIT_WINDOW_MS: ${AUTH_RESET_RATE_LIMIT_WINDOW_MS:-3600000}
  AUTH_REDEMPTION_RATE_LIMIT_MAX: ${AUTH_REDEMPTION_RATE_LIMIT_MAX:-5}
  AUTH_REDEMPTION_RATE_LIMIT_WINDOW_MS: ${AUTH_REDEMPTION_RATE_LIMIT_WINDOW_MS:-3600000}
  SESSION_IDLE_TTL_MINUTES: ${SESSION_IDLE_TTL_MINUTES:-480}
  SESSION_ABSOLUTE_TTL_MINUTES: ${SESSION_ABSOLUTE_TTL_MINUTES:-43200}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL:-mysql://pagepulse:local-pagepulse-only@mariadb:3306/pagepulse}
  REDIS_URL: ${REDIS_URL:-redis://:local-redis-only@redis:6379/0}
  QUEUE_PREFIX: ${QUEUE_PREFIX:-pagepulse}
  SCHEDULER_RECONCILIATION_INTERVAL_MS: ${SCHEDULER_RECONCILIATION_INTERVAL_MS:-300000}
  SNAPSHOT_ROOT: /data/snapshots

x-app-service: &app-service
  restart: unless-stopped
  init: true
  logging: *default-logging
  networks: [app, data]
  security_opt: [no-new-privileges:true]
  depends_on:
    mariadb: { condition: service_healthy }
    redis: { condition: service_healthy }
  healthcheck:
    test: [CMD, node, -e, 'process.kill(1, 0)']
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  gateway:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    logging: *default-logging
    networks: [edge, app]
    ports: ['127.0.0.1:${PAGEPULSE_HTTP_PORT:-8080}:8080']
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0755
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:8080/ >/dev/null']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on: { api: { condition: service_healthy } }

  api:
    <<: *app-service
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *app-environment
      PORT: 3000
      OWNER_DIAGNOSTICS_TOKEN:
      OWNER_DIAGNOSTICS_TOKEN_FILE:
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/health/live]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    <<: *app-service
    build: { context: ., dockerfile: apps/control-worker/Dockerfile }
    environment: { <<: *app-environment, WORKER_ROLE: scheduler }
    read_only: true
    tmpfs: [/tmp]

  fetch-worker:
    <<: *app-service
    build: { context: ., dockerfile: apps/fetch-worker/Dockerfile }
    environment:
      <<: *app-environment
      HTTP_FETCH_CONCURRENCY: ${HTTP_FETCH_CONCURRENCY:-8}
      HTTP_FETCH_TIMEOUT_MS: ${HTTP_FETCH_TIMEOUT_MS:-15000}
      HTTP_FETCH_MAX_BYTES: ${HTTP_FETCH_MAX_BYTES:-5242880}
      DOMAIN_CONCURRENCY: ${DOMAIN_CONCURRENCY:-2}
    read_only: true
    tmpfs: [/tmp]
    volumes: [snapshots:/data/snapshots]

  browser-worker:
    <<: *app-service
    build: { context: ., dockerfile: apps/browser-worker/Dockerfile }
    environment:
      <<: *app-environment
      BROWSER_CONCURRENCY_MIN: ${BROWSER_CONCURRENCY_MIN:-1}
      BROWSER_CONCURRENCY_MAX: ${BROWSER_CONCURRENCY_MAX:-2}
      BROWSER_MEMORY_HIGH_WATERMARK_MB: ${BROWSER_MEMORY_HIGH_WATERMARK_MB:-7000}
      BROWSER_JOB_TIMEOUT_MS: ${BROWSER_JOB_TIMEOUT_MS:-90000}
    shm_size: 512mb
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes: [snapshots:/data/snapshots]
    deploy:
      resources:
        limits:
          memory: ${BROWSER_MEMORY_LIMIT:-2g}

  change-worker:
    <<: *app-service
    build: { context: ., dockerfile: apps/control-worker/Dockerfile }
    environment: { <<: *app-environment, WORKER_ROLE: change-detection }
    read_only: true
    tmpfs: [/tmp]
    volumes: [snapshots:/data/snapshots]

  notification-worker:
    <<: *app-service
    build: { context: ., dockerfile: apps/control-worker/Dockerfile }
    environment:
      <<: *app-environment
      WORKER_ROLE: notification
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-PagePulse <pagepulse@example.test>}
    read_only: true
    tmpfs: [/tmp]

  maintenance-worker:
    <<: *app-service
    build: { context: ., dockerfile: apps/control-worker/Dockerfile }
    environment:
      <<: *app-environment
      WORKER_ROLE: maintenance
      SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-7}
      CHECK_HISTORY_RETENTION_DAYS: ${CHECK_HISTORY_RETENTION_DAYS:-30}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
    read_only: true
    tmpfs: [/tmp]
    volumes: [snapshots:/data/snapshots]

  mariadb:
    image: mariadb:11.8.5
    restart: unless-stopped
    logging: *default-logging
    networks: [data]
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-pagepulse}
      MARIADB_USER: ${MARIADB_USER:-pagepulse}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-local-pagepulse-only}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-local-root-only}
    volumes: [mariadb-data:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:8.4.0-alpine
    restart: unless-stopped
    logging: *default-logging
    networks: [data]
    command:
      [
        redis-server,
        --appendonly,
        'yes',
        --appendfsync,
        everysec,
        --requirepass,
        '${REDIS_PASSWORD:-local-redis-only}',
        --maxmemory-policy,
        noeviction,
      ]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${REDIS_PASSWORD:-local-redis-only}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD:-local-redis-only}'
    security_opt: [no-new-privileges:true]

networks:
  edge: {}
  app: { internal: true }
  data: { internal: true }

volumes:
  mariadb-data: {}
  redis-data: {}
  snapshots: {}
