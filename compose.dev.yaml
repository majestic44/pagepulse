x-dev-logging: &dev-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}

services:
  api:
    environment:
      AUTH_EMAIL_DELIVERY_MODE: mailpit
  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    networks: [app, edge]
    ports: ['127.0.0.1:8025:8025']
    logging: *dev-logging
  adminer:
    image: adminer:5.4.1-standalone
    restart: unless-stopped
    networks: [data]
    ports: ['127.0.0.1:8081:8080']
    environment: { ADMINER_DEFAULT_SERVER: mariadb }
    logging: *dev-logging
  devtools:
    build: { context: ., dockerfile: apps/devtools/Dockerfile }
    networks: [app]
    ports: ['127.0.0.1:4010:4010']
    environment: { PORT: 4010 }
    logging: *dev-logging
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:4010/targets/jobs >/dev/null']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  queue-dashboard:
    image: ghcr.io/felixmosh/bull-board:v6.15.0
    restart: unless-stopped
    networks: [data]
    ports: ['127.0.0.1:3001:3000']
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-only}
    depends_on: { redis: { condition: service_healthy } }
    logging: *dev-logging
