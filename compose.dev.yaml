services:
  gateway:
    ports: ['${PAGEPULSE_HTTP_PORT:-8080}:8080']
  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    networks: [app]
    ports: ['127.0.0.1:8025:8025']
    logging: { driver: json-file, options: { max-size: 5m, max-file: '2' } }
  adminer:
    image: adminer:5.4.1-standalone
    restart: unless-stopped
    networks: [data]
    ports: ['127.0.0.1:8081:8080']
    environment: { ADMINER_DEFAULT_SERVER: mariadb }
  devtools:
    build: { context: ., dockerfile: apps/devtools/Dockerfile }
    networks: [app]
    ports: ['127.0.0.1:4010:4010']
    environment: { PORT: 4010 }
  queue-dashboard:
    image: ghcr.io/felixmosh/bull-board:v6.15.0
    restart: unless-stopped
    networks: [data]
    ports: ['127.0.0.1:3001:3000']
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-only}
    depends_on: { redis: { condition: service_healthy } }
