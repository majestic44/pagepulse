server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  # API containers can be recreated independently; resolve the Compose DNS name for each proxied request.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;
  location /api/ { set $api_upstream api; proxy_pass http://$api_upstream:3000$request_uri; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /health/ { set $api_upstream api; proxy_pass http://$api_upstream:3000$request_uri; }
  location / { try_files $uri $uri/ /index.html; }
}
