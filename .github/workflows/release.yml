name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: api, dockerfile: apps/api/Dockerfile }
          - { name: fetch-worker, dockerfile: apps/fetch-worker/Dockerfile }
          - { name: browser-worker, dockerfile: apps/browser-worker/Dockerfile }
          - { name: control-worker, dockerfile: apps/control-worker/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: ghcr.io/majestic44/pagepulse-${{ matrix.name }}:${{ github.ref_name }},ghcr.io/majestic44/pagepulse-${{ matrix.name }}:latest
  deploy-notify:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Trigger restricted Plesk Git deployment webhook
        env:
          PLESK_DEPLOY_WEBHOOK_URL: ${{ secrets.PLESK_DEPLOY_WEBHOOK_URL }}
        run: |
          test -n "$PLESK_DEPLOY_WEBHOOK_URL"
          curl --fail --silent --show-error --max-time 20 --retry 2 --request POST "$PLESK_DEPLOY_WEBHOOK_URL"
