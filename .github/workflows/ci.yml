name: CI
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development]
permissions:
  contents: read
jobs:
  quality:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:release-metadata
      - run: pnpm compose:config
  api-integration:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8.5
        env:
          {
            MARIADB_DATABASE: pagepulse_test,
            MARIADB_USER: pagepulse,
            MARIADB_PASSWORD: pagepulse,
            MARIADB_ROOT_PASSWORD: root,
          }
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:8.4.0-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://pagepulse:pagepulse@127.0.0.1:3306/pagepulse_test
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
  dependency-review:
    name: Dependency vulnerability review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with: { fail-on-severity: high }
  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: pnpm audit --audit-level high
  docker-build:
    name: Docker image builds (${{ matrix.name }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Run each architecture natively so pnpm does not execute under QEMU emulation.
      fail-fast: false
      matrix:
        include:
          - {
              name: web,
              dockerfile: apps/web/Dockerfile,
              runner: ubuntu-24.04,
              platform: linux/amd64,
            }
          - {
              name: web,
              dockerfile: apps/web/Dockerfile,
              runner: ubuntu-24.04-arm,
              platform: linux/arm64,
            }
          - {
              name: api,
              dockerfile: apps/api/Dockerfile,
              runner: ubuntu-24.04,
              platform: linux/amd64,
            }
          - {
              name: api,
              dockerfile: apps/api/Dockerfile,
              runner: ubuntu-24.04-arm,
              platform: linux/arm64,
            }
          - {
              name: fetch-worker,
              dockerfile: apps/fetch-worker/Dockerfile,
              runner: ubuntu-24.04,
              platform: linux/amd64,
            }
          - {
              name: fetch-worker,
              dockerfile: apps/fetch-worker/Dockerfile,
              runner: ubuntu-24.04-arm,
              platform: linux/arm64,
            }
          - {
              name: browser-worker,
              dockerfile: apps/browser-worker/Dockerfile,
              runner: ubuntu-24.04,
              platform: linux/amd64,
            }
          - {
              name: browser-worker,
              dockerfile: apps/browser-worker/Dockerfile,
              runner: ubuntu-24.04-arm,
              platform: linux/arm64,
            }
          - {
              name: control-worker,
              dockerfile: apps/control-worker/Dockerfile,
              runner: ubuntu-24.04,
              platform: linux/amd64,
            }
          - {
              name: control-worker,
              dockerfile: apps/control-worker/Dockerfile,
              runner: ubuntu-24.04-arm,
              platform: linux/arm64,
            }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: ${{ matrix.platform }}
          tags: pagepulse/${{ matrix.name }}:ci
